name: CI/CD

# Every push and pull request is tested. A push to main that passes everything is also built into container
# images, scanned, published to GHCR and (when DEPLOY_ENABLED is set, see docs/DEPLOY.md) deployed.
# Actions are pinned to a full commit hash (a tag can be moved); Dependabot proposes the updates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  server:
    name: Server (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A real PostgreSQL for the database tests (the same ones also run on SQLite).
    services:
      postgres:
        image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: hajime
          POSTGRES_PASSWORD: hajime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hajime" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - run: uv sync --frozen
        working-directory: apps/server
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: apps/server
      - run: uv run mypy .
        working-directory: apps/server
      - run: uv run pytest --cov=app
        working-directory: apps/server
        env:
          HAJIME_SIM_GAMES: "10000"
          HAJIME_TEST_DATABASE_URL: postgresql+asyncpg://hajime:hajime@127.0.0.1:5432/postgres
      - name: Protocol types are up to date
        run: uv run --project apps/server python tools/gen_protocol.py --check

  web:
    name: Web (lint, types, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec prettier --check . && pnpm --filter web exec eslint .
      - run: pnpm --filter web exec svelte-check --tsconfig ./tsconfig.json
      - run: pnpm --filter web exec vitest run --project server
      - run: pnpm --filter web build

  e2e:
    name: End-to-end (production build, Chromium)
    needs: [server, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: uv sync --frozen
        working-directory: apps/server
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web build
      # The tests run against the production build, so the security headers and the strict Content-Security-Policy
      # are the ones that get deployed.
      - run: pnpm --filter web exec playwright test
        env:
          E2E_PREVIEW: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  containers:
    name: Container ${{ matrix.app }} (build, scan, start)
    needs: [server, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [server, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/${{ matrix.app }}/Dockerfile
          failure-threshold: warning
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: hajime-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan for known vulnerabilities (fixable HIGH and CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hajime-${{ matrix.app }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Starts, becomes healthy, runs as a non-root user
        run: |
          set -euo pipefail
          name="hajime-${{ matrix.app }}"
          if [ "${{ matrix.app }}" = server ]; then
            docker run -d --name "$name" -p 8000:8000 \
              -e HAJIME_ALLOWED_ORIGINS='["https://ci.hajime.dev"]' -e HAJIME_ALLOW_MISSING_ORIGIN=false               -e HAJIME_COOKIE_SECURE=true \
              "hajime-server:ci"
            port=8000; ready=/readyz
          else
            docker run -d --name "$name" -p 3000:3000 -e ORIGIN=https://ci.hajime.dev "hajime-web:ci"
            port=3000; ready=/up
          fi
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$name")"
            [ "$status" = healthy ] && break
            sleep 2
          done
          if [ "$status" != healthy ]; then docker logs "$name"; echo "container is $status"; exit 1; fi
          curl -fsS "http://127.0.0.1:${port}${ready}"
          echo
          uid="$(docker exec "$name" id -u)"
          [ "$uid" != 0 ] || { echo "the container runs as root"; exit 1; }
          if [ "${{ matrix.app }}" = web ]; then
            curl -fsSI -H 'accept: text/html' "http://127.0.0.1:3000/" | grep -i '^content-security-policy: default-src .none.'
            # the pages are really rendered by the production image (a library missing from it only shows there)
            for page in / /ja /en /history /ja/history /credits /r/ABCDEF; do
              curl -fsS -o /dev/null "http://127.0.0.1:3000${page}" || { echo "page ${page} fails"; docker logs "$name" | tail -20; exit 1; }
            done
          else
            # production refuses to start with unsafe settings: this must fail
            if docker run --rm -e HAJIME_ALLOWED_ORIGINS='["http://localhost:3000"]' hajime-server:ci                  python -c "from app.core.config import AppSettings; AppSettings()" >/dev/null 2>&1; then
              echo "an unsafe production configuration was accepted"; exit 1
            fi
          fi
      - name: Server image applies its migrations and connects to PostgreSQL
        if: matrix.app == 'server'
        run: |
          set -euo pipefail
          docker network create hajime-ci
          docker run -d --name pg --network hajime-ci -e POSTGRES_USER=hajime -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=hajime             postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
          for _ in $(seq 1 30); do docker exec pg pg_isready -U hajime -d hajime >/dev/null 2>&1 && break; sleep 1; done
          env_args=(-e HAJIME_DATABASE_URL=postgresql+asyncpg://hajime:ci@pg:5432/hajime
                    -e HAJIME_ALLOWED_ORIGINS='["https://ci.hajime.dev"]' -e HAJIME_ALLOW_MISSING_ORIGIN=false
                    -e HAJIME_COOKIE_SECURE=true)
          docker run --rm --network hajime-ci "${env_args[@]}" hajime-server:ci alembic upgrade head
          docker run -d --name server-db --network hajime-ci -p 8001:8000 "${env_args[@]}" hajime-server:ci
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' server-db)" = healthy ] && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8001/readyz | tee /dev/stderr | grep -q '"database":true'
          # The admin interface needs packages that only the production image shows to be missing (it once crashed the
          # real server): start it as production does, with the admin turned on at a secret address.
          docker run -d --name server-admin --network hajime-ci -p 8002:8000 "${env_args[@]}" \
                        -e HAJIME_ADMIN_PATH=/admin-ci-check \
            -e HAJIME_PUBLIC_URL=https://ci.hajime.dev -e HAJIME_SMTP_HOST=mail.invalid \
            -e HAJIME_SMTP_USER=ci@hajime.dev -e HAJIME_SMTP_PASSWORD=ci-only \
                        -e 'HAJIME_ADMIN_PASSWORD_HASH=$argon2id$v=19$m=65536,t=3,p=4$sqxapSUzTGlK4tzsVB+T4w$onhJXA9JkJBHAHUX0jRkJM+mes4TOks5rxd7zknIsNo' \
                        -e HAJIME_ADMIN_SECRET=ci-only-secret-ci-only-secret-ci-only-secret hajime-server:ci
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' server-admin)" = healthy ] && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8002/admin-ci-check/login | tee /dev/stderr | grep -qi 'login'
          # behind the proxy (which says the visitor used https) the admin must write https links, never http ones
          page="$(curl -fsS -H 'X-Forwarded-Proto: https' -H 'Host: ci.hajime.dev' http://127.0.0.1:8002/admin-ci-check/login)"
          echo "$page" | grep -q 'href="https://ci.hajime.dev/admin-ci-check/statics/'
          if echo "$page" | grep -q 'href="http://'; then
            echo 'the admin wrote an http:// link behind the https proxy' >&2
            exit 1
          fi
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8002/admin/login)" = 404 ]
      - name: Container logs
        if: always()
        run: docker logs "hajime-${{ matrix.app }}" || true

  deploy-config:
    name: Deployment files (compose, Caddy, scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Compose file is valid
        env:
          IMAGE_PREFIX: ghcr.io/example/hajime
          TAG: ci
          DOMAIN: ci.hajime.dev
          ACME_EMAIL: ci@hajime.dev
          POSTGRES_PASSWORD: ci
        run: docker compose -f deploy/compose.prod.yml config --quiet
      - name: Caddyfile is valid
        run: |
          docker run --rm -e DOMAIN=ci.hajime.dev -e ACME_EMAIL=ci@hajime.dev \
            -v "$PWD/deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Shell scripts pass ShellCheck
        run: shellcheck deploy/deploy.sh deploy/bootstrap-server.sh deploy/provision.sh deploy/stats.sh
      - name: Smoke test script compiles
        run: python3 -m py_compile deploy/smoke.py

  publish:
    name: Publish ${{ matrix.app }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e, containers, deploy-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # sign the provenance attestation
      attestations: write
    strategy:
      matrix:
        app: [server, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Image name (GHCR needs lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # the commit hash is the immutable tag the deployment uses; latest only follows main
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: mode=max
          sbom: true
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to production
    # Off until the repository variable DEPLOY_ENABLED is "true" (a fork or a first push never deploys).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [publish]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      tag: ${{ github.sha }}
    secrets: inherit
