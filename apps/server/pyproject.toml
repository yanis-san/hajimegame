[project]
name = "hajime-server"
license = "MIT"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jaconv>=0.5.0",
    "msgspec>=0.22.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "sqladmin>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "httpx-ws>=0.9.0",
    "hypothesis>=6.170.15",
    "locust>=2.47.0",
    "mypy>=2.4.1",
    "psutil>=7.2.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "PT011", "PT018", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF012"]
"app/admin/**" = ["RUF012"]  # SQLAdmin views are configured with plain class attributes
"app/japanese/romaji.py" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = []
exclude = ["app/db/migrations"]

[[tool.mypy.overrides]]
module = ["jaconv", "locust.*", "fakeredis.*", "httpx_ws.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# msgspec inherits frozen/forbid_unknown_fields from the base Struct at runtime; mypy cannot see that.
module = ["app.realtime.protocol"]
disable_error_code = ["misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long simulations"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '^\s+\.\.\.$']

[tool.uv]
# Run the code straight from this folder: an installed copy in .venv would go stale after every edit.
package = false
