# Local stack to try the real containers on your machine (not for production: see deploy/compose.prod.yml).
#   docker compose up --build              # web + game server behind one address: http://localhost:8080
#   docker compose --profile db up -d postgres redis   # only the backing services, run the apps with `pnpm dev`
# The game server uses no database today: Postgres is there for the accounts planned later.
services:
  server:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    environment:
      HAJIME_ENV: dev
      HAJIME_ALLOWED_ORIGINS: '["http://localhost:8080"]'
      HAJIME_TRUST_PROXY_HEADERS: "true"
    expose: ["8000"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      PORT: "3000"
      ORIGIN: http://localhost:8080
    expose: ["3000"]

  # One origin for the browser: /api and /ws go to the game server, everything else to the web app.
  proxy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    ports: ["8080:8080"]
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [server, web]

  postgres:
    profiles: [db]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hajime
      POSTGRES_PASSWORD: hajime
      POSTGRES_DB: hajime
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hajime"]
      interval: 5s
      retries: 10

  redis:
    profiles: [db]
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
