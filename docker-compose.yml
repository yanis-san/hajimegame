# Local stack to try the real containers on your machine (not for production: see deploy/compose.prod.yml).
#   docker compose up --build              # web + game server behind one address: http://localhost:8080
#   docker compose up -d postgres                      # only the database, then run the apps with `pnpm dev`
# Finished games are stored in PostgreSQL (accounts will use it too). Without HAJIME_DATABASE_URL the game still
# runs and simply does not store them.
services:
  server:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    environment:
      HAJIME_ENV: dev
      HAJIME_ALLOWED_ORIGINS: '["http://localhost:8080"]'
      HAJIME_TRUST_PROXY_HEADERS: "true"
      # Finished games are stored here: run `docker compose run --rm server alembic upgrade head` once first.
      HAJIME_DATABASE_URL: postgresql+asyncpg://hajime:hajime@postgres:5432/hajime
    expose: ["8000"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      PORT: "3000"
      ORIGIN: http://localhost:8080
    expose: ["3000"]

  # One origin for the browser: /api and /ws go to the game server, everything else to the web app.
  proxy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    ports: ["8080:8080"]
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [server, web]

  postgres:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_USER: hajime
      POSTGRES_PASSWORD: hajime
      POSTGRES_DB: hajime
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hajime"]
      interval: 5s
      retries: 10

  redis:
    profiles: [scale]   # only needed with several game servers
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
